{% extends 'account/base.html' %}
{% block title %}Delete User{% endblock %}

{% block content %}
<div class="card confirm-card">
    <h2>Delete User</h2>
    <p>Are you sure you want to delete <strong>{{ user.get_full_name|default:user.username }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn btn-secondary" href="{% url 'user-list' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
