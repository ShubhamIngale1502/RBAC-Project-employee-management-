{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f4f6f9;
        }


        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }


        .login-card {
            background: #ffffff;

            border-radius: 12px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .logo {
            text-align: center;
            margin-bottom: 25px;
        }


        .logo-circle {
            width: 65px;
            height: 65px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2563eb;
            color: white;

            font-size: 26px;
            font-weight: bold;
        }


        h2 {
            margin: 15px 0 5px;

            text-align: center;

            color: #1f2937;
        }


        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 14px;

            font-weight: 600;
        }


        input {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        .login-btn {
            width: 100%;

            border: none;

            padding: 12px;

            margin-top: 8px;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-btn:hover {
            background: #1d4ed8;
        }


        .message {
            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 6px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;
        }


        .footer {
            margin-top: 20px;

            text-align: center;

            font-size: 12px;

            color: #9ca3af;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            <div class="logo-circle">
                EM
            </div>

        </div>


        <h2>
            Employee Management
        </h2>


        <div class="subtitle">
            Sign in to access your account
        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Sign In
            </button>

        </form>


        <div class="footer">

            Employee Management System

        </div>


    </div>


</div>


</body>

</html>
