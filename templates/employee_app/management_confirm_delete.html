{% extends "account/base.html" %}
{% block title %}Delete {{ page_title }}{% endblock %}
{% block content %}
<section class="record-form" style="max-width:560px"><h2>Delete {{ page_title|slice:":-1" }}</h2><p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p><form method="post">{% csrf_token %}<button class="save" style="background:#b42318" type="submit">Delete</button> <a class="cancel" href="{% url 'management-list' model_key %}">Cancel</a></form></section>
{% endblock %}
